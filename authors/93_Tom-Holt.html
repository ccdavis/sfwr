 <style>
 
 html,body {
	height:100%;
	margin: em;
 }

:root {
	 
	--btn-fg: #2a2a2a;
	--btn-fg-hover: #000;
	--btn-border: rgba(20, 20, 20, 0.28);
	--btn-accent: #0a7ea3;
	--btn-hover-bg: rgba(10, 126, 163, 0.06);
	--btn-active-bg: rgba(10, 126, 163, 0.12);
}

 .buttonlink {
	display: inline-flex;
	align-items: center;
	justify-content: center;
	padding: 0.6em 1.25em;
	min-width: 4em;
	font-family: 'Questrial', 'Hammersmith One', sans-serif;
	font-size: 0.82em;
	font-weight: 400;
	letter-spacing: 0.14em;
	text-transform: uppercase;
	text-decoration: none;
	color: var(--btn-fg);
	background: transparent;
	border: 1px solid var(--btn-border);
	border-radius: 2px;
	line-height: 1.4;
	transition: color 180ms ease, border-color 180ms ease, background-color 180ms ease;
	-webkit-tap-highlight-color: transparent;
	box-sizing: border-box;
}
.buttonlink:hover {
	color: var(--btn-fg-hover);
	border-color: var(--btn-accent);
	background: var(--btn-hover-bg);
}
.buttonlink:focus-visible {
	outline: 2px solid var(--btn-accent);
	outline-offset: 3px;
}
.buttonlink:active {
	background: var(--btn-active-bg);
}

 
.top-menu,
.book-grid {
	--btn-fg: #e8e8e8;
	--btn-fg-hover: #fff;
	--btn-border: rgba(232, 232, 232, 0.28);
	--btn-accent: #6cf;
	--btn-hover-bg: rgba(102, 204, 255, 0.09);
	--btn-active-bg: rgba(102, 204, 255, 0.16);
}

	  
	 h1 {
		font-size: 36px;
		
	}

	h2 {
		font-size: 30px;
		
	}

	h3 {
		font-size: 24px;
		
	}

	h4 {
		font-size: 18px;		
	}

	div.site-name {
	text-align:center;
	font-size: 3.5em;	
	line-height: 1.1em;
	margin: 0.1em 0 .1em 0;
	font-weight: bold;
	
	font-family: 'Hammersmith One', sans-serif;
	text-shadow: 0 -1px 0 rgba(0,0,0,0.4);
	position: relative;	
}

	div.list-name {
		text-align:center;
		font-size: 36px;
		line-height: 38px;
		margin: 1em 0 .6em 0;
		font-weight: bold;
	
		font-family: 'Hammersmith One', sans-serif;
		text-shadow: 0 -1px 0 rgba(0,0,0,0.4);
		position: relative;	
	}

	div.article-text {
		font-size: 1.0em;
		font-weight: normal;
		font-family: 'Tahoma', sans-serif;
	}



.citation .main h2:after, 
.citation .main h3:after, 
.citation .main h4:after {	
	content: "";
	left: 0;
	top: 0;
	bottom: 0;
	width: 5px;
	border-radius: 2px;
	box-shadow: 
		inset 0 1px 1px rgba(0,0,0,0.5), 
		0 1px 1px rgba(255,255,255,0.3);
}

.citation .main h2:after { background: #0AF; }
.citation .main h3:after { background: #3BF; }
.citation .main h4:after { background: #6Cf; }

.citation .main h1 {
	font-size: 36px;
	line-height: 40px;
	margin: 1em 0 .6em 0;
	font-weight: normal;
	
	font-family: 'Hammersmith One', sans-serif;
	text-shadow: 0 -1px 0 rgba(0,0,0,0.4);
	position: relative;
	color: #6Cf;
}

.citation .main h2 {
	margin: 1em 0 .6em 0;
	padding: 0 0 0 20px;
	font-weight: normal;
	color: white;
	font-family: 'Hammersmith One', sans-serif;
	text-shadow: 0 -1px 0 rgba(0,0,0,0.4);
	position: relative;
	font-size: 30px;
	line-height: 25px;
}

.citation .main h3 {
	margin: 1em 0 .6em 0;
	padding: 0 0 0 20px;
	font-weight: normal;
	color: white;
	font-family: 'Hammersmith One', sans-serif;
	text-shadow: 0 -1px 0 rgba(0,0,0,0.4);
	position: relative;
	font-size: 24px;
	line-height: 25px;
	font-family: 'Questrial', sans-serif;
}

.citation .main h4 { 
	margin: 1em 0 .6em 0;
	padding: 0 0 0 20px;
	font-weight: normal;
	color: white;
	font-family: 'Hammersmith One', sans-serif;
	text-shadow: 0 -1px 0 rgba(0,0,0,0.4);
	position: relative;
	font-size: 18px;
	line-height: 20px;
	font-family: 'Questrial', sans-serif;
}
	  
	  
 div.top-menu {	
	width:100%;
	display:flex;
	flex-direction:row;
	background-color: #117;
	color: #dd1;	
 }


 div.menu-item {	
	padding: 2%;
	align-items: center;	
 }
 
div.content-container {	
	overflow-y: auto;	
	height: 90%;
	width:100%;
	padding: 0 2.5%;
	box-sizing: border-box;
	max-width: 100%;	
 }

 div.book-entry {
	display: table;
	margin:0 auto;	
 }
 
 div.book-list{ 			
	display: table;
	margin:0 auto;
	width: 100%;
	max-width: 900px;
	padding: 0 15px;
	box-sizing: border-box;
 }
 
 div.author-index{ 			
	display: table;
	margin:0 auto;
 }
 
 
 div.book-item{	
	display: flex;
	flex-direction: row;	
	padding: 5px;
	margin: 2.0em 0 2.0em 0;
 }

 div.book-info {
	display: flex;
	flex-direction: column;		
	margin: 0 0 0 0.6em;
 }
 
 div.book-grid {
	display: flex;
	flex-wrap: wrap;
	justify-content: space-between;
	gap: 4.0em 8.0em;
	max-width: 2100px;
	margin: 0 auto;
	background-color: #111;
 }
 
 div.book-box {	
     flex: 1 1 calc(20% - 40px);
	min-height: 25	0px;
	min-width: 280px;
	padding: 5px;
	border-radius: 5px;
	box-shadow: 0 2px 5px rgba(0,0,0,0.1);
	transition: transform 0.3s ease;	
	background-color: #111;
	display:flex;
	flex-direction: row;
 }


        @media (max-width: 768px) {
            div.book-box {
                flex-basis: 48%;
                min-height: 150px;
                min-width: 0;
            }
            
            div.book-item {
                flex-direction: column;
            }
            
            div.medium-cover-image,
            div.large-cover-image {
                padding-right: 0;
                margin-bottom: 1em;
                width: 100%;
                justify-content: center;
            }
            
            div.content-container {
                padding: 0 1.5%;
            }
        }

        @media (max-width: 480px) {
            div.book-box {
                flex-basis: 100%;
                min-height: 100px;
                min-width: 0;
            }
            
            div.book-item {
                margin: 1.0em 0;
                flex-direction: column;
                align-items: center;
            }
            
            div.book-info {
                text-align: center;
                margin: 0;
            }
            
            div.content-container {
                padding: 0 1%;
            }
            
            div.book-list {
                padding: 0 5px;
                width: 100%;
            }
            
            div.small-cover-image,
            div.medium-cover-image,
            div.large-cover-image {
                margin: 0 0 1em 0;
                align-items: center;
                padding-right: 0;
                width: 100%;
                justify-content: center;
            }
            
            .buttonlink {
                min-width: auto;
                padding: 0.5em 1em;
                font-size: 0.78em;
                letter-spacing: 0.1em;
            }
        }

        @media (max-width: 375px) {
            div.top-menu {
                padding: 0;
            }
            
            div.menu-item {
                padding: 0.5%;
                font-size: 0.9em;
            }
            
            .buttonlink {
                min-width: auto;
                font-size: 0.72em;
                padding: 0.45em 0.85em;
                letter-spacing: 0.08em;
            }
            
            table {
                margin: 0;
            }
            
            h1 { font-size: 24px; }
            h2 { font-size: 20px; }
            h3 { font-size: 18px; }
            h4 { font-size: 14px; }
            
            div.site-name {
                font-size: 1.8em;
            }
            
            div.list-name {
                font-size: 20px;
            }
        }
 
div.book-box:hover {
	transform: translateY(-5px);
}

 
 div.book-title {	
	text-transform: uppercase;
	text-decoration: underline;
 }
 
 div.book-subtitle {	
	text-align: center;
	text-decoration: none;	
 }
 
 div.book-author {
	text-decoration: none;	
 }
 
 div.small-cover-image {
	display:flex;
	flex-direction: column;
	align-items: center;
	margin: 1.4em 0.5em 0 0;
	padding-right: 10px;
 }

 div.medium-cover-image {
	display:flex;
	align-items: center;
	padding-right: 10%;
	padding-top: 5px;	
 }
 
 div.large-cover-image {
	display:flex;
	align-items: center;
	padding-right: 10%;
	padding-top: 5%;
 }

}

.book-tags {

}

.star-rating {
    color: #e9a820;
    letter-spacing: 1px;
}
