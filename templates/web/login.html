{{template "base.html" .}}

{{define "content"}}
<div style="max-width: 420px; margin: 8vh auto 0 auto;">
    <h1>SFWR Admin</h1>

    {{if .Error}}
    <div class="error">{{.Error}}</div>
    {{end}}

    <form method="POST" action="{{url "/login"}}">
        <input type="hidden" name="{{.CSRFFieldName}}" value="{{.CSRFToken}}">
        <input type="hidden" name="next" value="{{.NextPath}}">

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="current-password"
                   required autofocus style="max-width: 100%;">
        </div>

        <div class="form-group">
            <button type="submit" class="buttonlink" style="font-size: 16px; padding: 12px 24px; width: 100%;">
                Sign In
            </button>
        </div>
    </form>

    <p style="color: #888; font-size: 13px; text-align: center;">
        Book collection management. Nothing here is public.
    </p>
</div>
{{end}}
