<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="author" content="Colin Davis" />

    <style>
        html, body {
            min-height: 100vh;
            font-family: 'Tahoma', sans-serif;
            background-color: #111;
            color: #ddd;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        a {
            color: #6Cf;
        }

        .buttonlink {
            display: inline-block;
            border-style: solid;
            border-color: #bbb #888 #666 #aaa;
            border-width: 3px 4px 4px 3px;
            padding: 8px 16px;
            background: #ccc;
            color: #333;
            text-align: center;
            text-decoration: none;
            font-weight: 900;
            font-size: 15px;
            font-family: inherit;
            cursor: pointer;
            margin: 2px;
        }

        .buttonlink:hover {
            border-color: #666 #aaa #bbb #888;
            border-width: 4px 3px 3px 4px;
            color: #000;
        }

        .buttonlink:focus-visible {
            outline: 3px solid #6Cf;
            outline-offset: 2px;
        }

        .button-danger {
            background: #d44;
            color: white;
        }

        .button-danger:hover {
            background: #f66;
            color: white;
        }

        h1 {
            font-size: 36px;
            color: #6Cf;
            font-family: 'Hammersmith One', sans-serif;
            text-shadow: 0 -1px 0 rgba(0,0,0,0.4);
            text-align: center;
            margin-bottom: 30px;
        }

        h2 {
            font-size: 30px;
            color: #6Cf;
            font-family: 'Hammersmith One', sans-serif;
            margin-bottom: 20px;
        }

        .nav-menu {
            background-color: #115;
            color: #dd1;
            padding: 15px 0;
            margin-bottom: 30px;
        }

        .nav-menu ul {
            list-style: none;
            margin: 0;
            padding: 0 10px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
        }

        .nav-menu li {
            display: inline;
        }

        /* Marks the section the current page belongs to. */
        .nav-menu .buttonlink.active {
            background: #6Cf;
            color: #002;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #ddd;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            max-width: 500px;
            padding: 10px;
            border: 2px solid #555;
            background-color: #222;
            color: #ddd;
            font-size: 16px;
        }

        .form-group textarea {
            height: 100px;
            resize: vertical;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #6Cf;
            outline: none;
        }

        .book-item, .author-item {
            background-color: #222;
            border: 1px solid #444;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 5px;
        }

        .book-title {
            color: #6Cf;
            font-size: 20px;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .book-author {
            color: #aaa;
            text-transform: uppercase;
            font-weight: 300;
            margin-bottom: 10px;
        }

        .book-details {
            color: #ccc;
            margin-bottom: 15px;
        }

        .book-details p {
            margin: 0 0 8px 0;
        }

        .actions {
            margin-top: 15px;
        }

        /* Book list rows: cover thumbnail beside the details. */
        .book-row {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        .book-cover-thumb {
            flex-shrink: 0;
            width: 70px;
            height: 105px;
            object-fit: cover;
            border: 1px solid #555;
            background-color: #333;
        }

        .book-cover-missing {
            flex-shrink: 0;
            width: 70px;
            height: 105px;
            border: 1px dashed #555;
            color: #666;
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .book-row-body {
            flex: 1;
            min-width: 0;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            gap: 15px;
            margin-bottom: 30px;
        }

        .toolbar .form-group {
            margin-bottom: 0;
        }

        .toolbar input,
        .toolbar select {
            width: auto;
        }

        .result-count {
            color: #aaa;
            margin-bottom: 20px;
        }

        .pagination {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 30px 0;
            flex-wrap: wrap;
        }

        .pagination .current {
            color: #aaa;
        }

        .message {
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
            background-color: #3a5;
            color: white;
        }

        .error {
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
            background-color: #d44;
            color: white;
        }

        .empty-state {
            text-align: center;
            margin-top: 50px;
        }

        .rating-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 10px;
        }

        .rating-option {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .rating-option input[type="radio"] {
            width: auto;
        }

        /* Sections and checkbox lists used by the author editor. */
        .section {
            background-color: #222;
            border: 1px solid #444;
            padding: 20px;
            margin-bottom: 25px;
            border-radius: 5px;
        }

        .checkbox-list {
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #444;
            padding: 10px;
            background-color: #1a1a1a;
            margin-bottom: 15px;
        }

        .checkbox-row {
            padding: 5px 0;
        }

        .checkbox-row label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: normal;
        }

        .checkbox-row input[type="checkbox"] {
            width: auto;
        }

        .tag-icon {
            display: inline-block;
            line-height: 1;
            vertical-align: middle;
            margin-right: 3px;
        }

        .tag-indy {
            color: #e9a820;
            font-size: 1.15em;
        }

        .tag-interesting {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 1.3em;
            height: 1.3em;
            border: 2px solid #b080e0;
            border-radius: 50%;
            color: #b080e0;
            font-weight: 900;
            font-size: 0.9em;
            line-height: 1;
        }

        .book-tags {
            display: inline-block;
            margin-left: 4px;
        }

        .star-rating {
            color: #e9a820;
            letter-spacing: 1px;
        }

        .danger-zone {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 2px solid #444;
        }

        .danger-zone h3 {
            color: #d44;
        }

        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }

            h1 {
                font-size: 28px;
            }

            .nav-menu ul {
                gap: 6px;
            }

            .book-row {
                gap: 12px;
            }
        }
    </style>

    <title>{{.Title}} - SFWR Management</title>
</head>
<body>
    {{if not .HideNav}}
    <div class="nav-menu">
        <ul>
            <li><a class="buttonlink {{if eq .Active "home"}}active{{end}}" href="{{url "/"}}">Home</a></li>
            <li><a class="buttonlink {{if eq .Active "books"}}active{{end}}" href="{{url "/books"}}">Books</a></li>
            <li><a class="buttonlink {{if eq .Active "book-new"}}active{{end}}" href="{{url "/books/new"}}">Add Book</a></li>
            <li><a class="buttonlink {{if eq .Active "authors"}}active{{end}}" href="{{url "/authors"}}">Authors</a></li>
            <li><a class="buttonlink {{if eq .Active "author-new"}}active{{end}}" href="{{url "/authors/new"}}">Add Author</a></li>
            <li><a class="buttonlink {{if eq .Active "decades"}}active{{end}}" href="{{url "/decades"}}">Decades</a></li>
            {{if .LocalRequest}}
            <li><a class="buttonlink {{if eq .Active "backups"}}active{{end}}" href="{{url "/backups"}}">Deployments</a></li>
            {{end}}
            {{if and .AuthEnabled .Authenticated}}
            <li>
                <form method="POST" action="{{url "/logout"}}" style="display: inline;">
                    <input type="hidden" name="{{.CSRFFieldName}}" value="{{.CSRFToken}}">
                    <button type="submit" class="buttonlink">Sign Out</button>
                </form>
            </li>
            {{end}}
        </ul>
    </div>
    {{end}}

    <div class="container">
        {{block "content" .}}
        <h1>{{.Title}}</h1>
        <p>Template content not found</p>
        {{end}}
    </div>
</body>
</html>
