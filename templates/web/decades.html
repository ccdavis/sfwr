{{template "base.html" .}}

{{define "content"}}
<h1>{{.Title}}</h1>

{{if .Message}}
<div class="message">{{.Message}}</div>
{{end}}

{{if .Decades}}
{{range .Decades}}
<div class="author-item">
    <div style="display: flex; justify-content: space-between; align-items: center; gap: 15px;">
        <div>
            <div class="book-title" style="margin-bottom: 5px;">{{.Decade}}</div>
            <div class="book-details" style="margin-bottom: 0;">{{len .Books}} book(s)</div>
        </div>
        <a class="buttonlink" href="{{url "/decades/"}}{{.Decade}}">See All</a>
    </div>
</div>
{{end}}
{{else}}
<div class="empty-state">
    <h2>No decades found</h2>
    <p>No books with publication dates found in the database.</p>
</div>
{{end}}
{{end}}
