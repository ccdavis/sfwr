:root {
	/* Light-context defaults (white/pale body content). Dark containers
	   below override these via inheritance. */
	--btn-fg: #2a2a2a;
	--btn-fg-hover: #000;
	--btn-border: rgba(20, 20, 20, 0.28);
	--btn-accent: #0a7ea3;
	--btn-hover-bg: rgba(10, 126, 163, 0.06);
	--btn-active-bg: rgba(10, 126, 163, 0.12);
}

 .buttonlink {
	display: inline-flex;
	align-items: center;
	justify-content: center;
	padding: 0.6em 1.25em;
	min-width: 4em;
	font-family: 'Questrial', 'Hammersmith One', sans-serif;
	font-size: 0.82em;
	font-weight: 400;
	letter-spacing: 0.14em;
	text-transform: uppercase;
	text-decoration: none;
	color: var(--btn-fg);
	background: transparent;
	border: 1px solid var(--btn-border);
	border-radius: 2px;
	line-height: 1.4;
	transition: color 180ms ease, border-color 180ms ease, background-color 180ms ease;
	-webkit-tap-highlight-color: transparent;
	box-sizing: border-box;
}
.buttonlink:hover {
	color: var(--btn-fg-hover);
	border-color: var(--btn-accent);
	background: var(--btn-hover-bg);
}
.buttonlink:focus-visible {
	outline: 2px solid var(--btn-accent);
	outline-offset: 3px;
}
.buttonlink:active {
	background: var(--btn-active-bg);
}

/* Dark-context overrides: the top nav strip and the dark book grid both
   have dark backgrounds, so inherit light-on-dark button palette. */
.top-menu,
.book-grid {
	--btn-fg: #e8e8e8;
	--btn-fg-hover: #fff;
	--btn-border: rgba(232, 232, 232, 0.28);
	--btn-accent: #6cf;
	--btn-hover-bg: rgba(102, 204, 255, 0.09);
	--btn-active-bg: rgba(102, 204, 255, 0.16);

 /* ---------------------------------------------------------------
    Cover slots.

    Cover art comes from three sources at different sizes: Open Library
    returns 180px-wide thumbnails, Google Books and Apple return
    anywhere from 60px to 153px. Nothing sized the images, so each
    cover column took its own intrinsic width and titles started at
    different offsets. It looked right before only because every cover
    happened to be 180px wide.

    A fixed slot lines the titles up. max-width on the image keeps a
    small cover from being upscaled and blurred - it just sits in the
    slot. flex-start puts the cover level with the title instead of
    centring it against a taller block of text.

    These rules only touch the three cover containers; nothing above
    depends on them.
    --------------------------------------------------------------- */

 div.small-cover-image {
	flex: 0 0 80px;
	width: 80px;
	align-items: flex-start;
	justify-content: center;
 }
 div.small-cover-image img {
	max-width: 80px;
	max-height: 110px;
	height: auto;
 }

 div.medium-cover-image {
	flex: 0 0 180px;
	width: 180px;
	align-items: flex-start;
	justify-content: center;
 }
 div.medium-cover-image img {
	max-width: 180px;
	max-height: 300px;
	height: auto;
 }

 div.large-cover-image {
	flex: 0 0 auto;
	align-items: flex-start;
	justify-content: center;
 }
 div.large-cover-image img {
	max-width: 340px;
	max-height: 520px;
	height: auto;
 }

 /* Narrow screens stack the cover above the text, so the fixed slot
    has to give way to the full-width rules in the media queries above. */
 @media (max-width: 768px) {
	div.small-cover-image,
	div.medium-cover-image,
	div.large-cover-image {
		flex: 0 0 auto;
		width: 100%;
		justify-content: center;
	}
 }
